buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        // Add local Maven repository path
        maven {
            url "/Users/wl/Desktop/job/learn/rntest/Playsout_sdk_android-main/build/host/outputs/repo"
            // url "../../Playsout_sdk_android-main/build/host/outputs/repo"
        }
        // Add Flutter official repository
        maven {
            url "https://storage.googleapis.com/download.flutter.io"
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
// Important: Add allprojects configuration at the end of the file to ensure app modules can also access these repositories
allprojects {
    repositories {
        google()
        mavenCentral()
        // Local Flutter module repository
        maven {
            url "/Users/wl/Desktop/job/learn/rntest/Playsout_sdk_android-main/build/host/outputs/repo"
            // url "../../Playsout_sdk_android-main/build/host/outputs/repo"
        }
        // Flutter official repository
        maven {
            url "https://storage.googleapis.com/download.flutter.io"
        }
    }
}

